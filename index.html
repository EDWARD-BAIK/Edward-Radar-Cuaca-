<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDWARD - Radar Cuaca Indonesia</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0a0e1a; 
            color: #fff; 
            overflow: hidden; 
            height: 100vh; 
            width: 100vw;
        }
        
        #header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 12px 20px 10px;
            background: linear-gradient(180deg, rgba(10, 14, 26, 0.95) 0%, rgba(10, 14, 26, 0) 100%);
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        #header .left h1 {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #4fc3f7, #00e5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        
        #header .left .sub {
            font-size: 10px;
            color: #78909c;
            letter-spacing: 2px;
            margin-top: -2px;
        }
        
        #header .right {
            pointer-events: auto;
            text-align: right;
        }
        
        #header .right .live-status {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-end;
        }
        
        #header .right .pulse-dot {
            width: 8px;
            height: 8px;
            background: #4fc3f7;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 1; }
        }
        
        #header .right .time {
            font-size: 12px;
            color: #b0bec5;
            font-weight: 300;
            letter-spacing: 1px;
            margin-top: 2px;
            font-variant-numeric: tabular-nums;
        }
        
        #map {
            height: 100vh;
            width: 100vw;
            background: #0a0e1a;
            position: relative;
        }
        
        #bottom-panel {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 95%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        
        #legend {
            background: rgba(10, 14, 26, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(79, 195, 247, 0.15);
            border-radius: 14px;
            padding: 10px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px 20px;
            font-size: 11px;
            color: #b0bec5;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
        }
        
        #legend .item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        #legend .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }
        
        #legend .label {
            font-weight: 400;
            font-size: 11px;
        }
        
        #legend .separator {
            color: #37474f;
            font-size: 16px;
        }
        
        #warning-bar {
            background: rgba(255, 60, 60, 0.12);
            border: 1px solid rgba(255, 60, 60, 0.25);
            border-radius: 12px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
            font-size: 11px;
            color: #ff8a80;
            pointer-events: auto;
        }
        
        #warning-bar i {
            font-size: 16px;
            color: #ff5252;
            flex-shrink: 0;
        }
        
        #warning-bar .warning-text {
            flex: 1;
            line-height: 1.4;
        }
        
        #warning-bar .warning-text strong {
            color: #ff8a80;
        }
        
        .custom-control {
            position: absolute;
            right: 16px;
            bottom: 130px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .custom-control button {
            background: rgba(10, 14, 26, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(79, 195, 247, 0.2);
            border-radius: 10px;
            color: #b0bec5;
            padding: 0;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }
        
        .custom-control button:hover {
            background: rgba(79, 195, 247, 0.2);
            border-color: #4fc3f7;
            color: #4fc3f7;
        }
        
        @media (max-width: 768px) {
            #header .left h1 { font-size: 22px; }
            #header .left .sub { font-size: 9px; }
            #legend { font-size: 10px; padding: 8px 12px; gap: 6px 14px; }
            #legend .dot { width: 14px; height: 14px; }
            #warning-bar { font-size: 10px; padding: 6px 12px; }
            .custom-control { right: 10px; bottom: 110px; }
            .custom-control button { width: 36px; height: 36px; font-size: 13px; }
        }
        
        @media (max-width: 480px) {
            #header .left h1 { font-size: 18px; }
            #legend .separator { display: none; }
            #legend { gap: 4px 10px; }
            #warning-bar i { font-size: 13px; }
        }
        
        .leaflet-control-attribution {
            background: rgba(0, 0, 0, 0.7) !important;
            color: #546e7a !important;
            font-size: 8px !important;
            padding: 2px 8px !important;
            border-radius: 6px !important;
            margin: 6px !important;
        }
        .leaflet-control-attribution a {
            color: #4fc3f7 !important;
        }
        
        .leaflet-control-zoom {
            border: none !important;
        }
        .leaflet-control-zoom a {
            background: rgba(10, 14, 26, 0.85) !important;
            backdrop-filter: blur(10px) !important;
            border: 1px solid rgba(79, 195, 247, 0.2) !important;
            color: #b0bec5 !important;
        }
        .leaflet-control-zoom a:hover {
            background: rgba(79, 195, 247, 0.2) !important;
            color: #4fc3f7 !important;
        }
    </style>
</head>
<body>

    <div id="header">
        <div class="left">
            <h1>EDWARD</h1>
            <div class="sub">RADAR CUACA INDONESIA</div>
        </div>
        <div class="right">
            <div class="live-status">
                <span class="pulse-dot"></span>
                <span style="font-size: 11px; color: #4fc3f7; font-weight: 600;">LIVE</span>
            </div>
            <!-- Waktu sekarang (Berjalan real-time setiap detik) -->
            <div class="time" id="live-time">Memuat Jam...</div>
        </div>
    </div>

    <div id="map"></div>

    <div class="custom-control">
        <button onclick="refreshRadar()" title="Refresh Radar">
            <i class="fas fa-sync-alt"></i>
        </button>
        <button onclick="toggleLegend()" title="Legenda">
            <i class="fas fa-info-circle"></i>
        </button>
        <button onclick="centerMap()" title="Reset Peta">
            <i class="fas fa-home"></i>
        </button>
    </div>

    <div id="bottom-panel">
        <div id="warning-bar">
            <i class="fas fa-satellite-dish"></i>
            <div class="warning-text">
                <strong>Data Radar:</strong> <span id="warning-message">Mencari data terbaru...</span>
            </div>
        </div>

        <div id="legend">
            <div class="item">
                <span class="dot" style="background: linear-gradient(135deg, #1a237e, #283593);"></span>
                <span class="label">Ringan</span>
            </div>
            <div class="item">
                <span class="dot" style="background: linear-gradient(135deg, #0d47a1, #1565c0);"></span>
                <span class="label">Sedang</span>
            </div>
            <div class="item">
                <span class="dot" style="background: linear-gradient(135deg, #b71c1c, #c62828);"></span>
                <span class="label">Lebat</span>
            </div>
            <div class="item">
                <span class="dot" style="background: linear-gradient(135deg, #ff6f00, #e65100);"></span>
                <span class="label">Ekstrem</span>
            </div>
            <span class="separator">|</span>
            <div class="item">
                <i class="fas fa-cloud-rain" style="color: #4fc3f7;"></i>
                <span style="color: #78909c; font-size: 11px;">Intensitas Hujan</span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        (function() {
            'use strict';

            
            
            
            const CONFIG = {
                center: [-2.5, 118.0],
                zoom: 5,
                minZoom: 4,
                maxZoom: 8,
                indonesiaBounds: [[-11.0, 95.0], [6.0, 141.0]]
            };

            
            let map = null;
            let radarLayer = null;
            let isMapReady = false;

           
            function initMap() {
                try {
                    map = L.map('map', {
                        center: CONFIG.center,
                        zoom: CONFIG.zoom,
                        minZoom: CONFIG.minZoom,
                        maxZoom: CONFIG.maxZoom,
                        maxBounds: CONFIG.indonesiaBounds,
                        zoomControl: true,
                        attributionControl: true,
                    });

                    
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                        attribution: '&copy; OpenStreetMap & Carto',
                        subdomains: 'abcd',
                        maxZoom: 19,
                    }).addTo(map);

                    isMapReady = true;

                    
                    loadRadar();
                    loadIndonesiaBoundary();
                    updateTime();

                    
                    setInterval(loadRadar, 180000); 
                    
                    
                    setInterval(updateTime, 1000);

                    setTimeout(() => {
                        if (map) map.invalidateSize();
                    }, 500);

                } catch (error) {
                    console.error('❌ Gagal inisialisasi map:', error);
                }
            }

            
            function loadRadar() {
                if (!isMapReady || !map) return;

                
                const radarUrl = `https://api.rainviewer.com/public/weather-maps.json?_=${Date.now()}`;

                fetch(radarUrl)
                    .then(res => {
                        if (!res.ok) throw new Error('Gagal fetch data radar');
                        return res.json();
                    })
                    .then(data => {
                        if (!data.radar || !data.radar.past || data.radar.past.length === 0) {
                            throw new Error('Data radar kosong');
                        }

                        
                        const host = data.host; 
                        
                        
                        const latest = data.radar.past[data.radar.past.length - 1];
                        const tilePath = latest.path;
                        
                        
                        const tileUrl = `${host}${tilePath}/256/{z}/{x}/{y}/2/1_1.png`;

                        
                        const newRadarLayer = L.tileLayer(tileUrl, {
                            opacity: 0.70,
                            transparent: true,
                            attribution: 'Radar &copy; RainViewer',
                            minZoom: CONFIG.minZoom,
                            maxZoom: CONFIG.maxZoom,
                        });

                        newRadarLayer.addTo(map);

                        
                        setTimeout(() => {
                            if (radarLayer && map.hasLayer(radarLayer)) {
                                map.removeLayer(radarLayer);
                            }
                            radarLayer = newRadarLayer;
                        }, 1000);

                        
                        const date = new Date(latest.time * 1000);
                        const radarTimeStr = date.toLocaleTimeString('id-ID', { 
                            hour: '2-digit', 
                            minute: '2-digit'
                        });
                        
                        document.getElementById('warning-message').innerHTML = 
                            `Citra Terakhir: <strong>${radarTimeStr} WIB</strong> (Otomatis Refresh)`;

                    })
                    .catch(error => {
                        console.error('❌ Gagal load radar:', error);
                        document.getElementById('warning-message').textContent = 
                            'Gagal menarik data radar. Menunggu percobaan berikutnya...';
                    });
            }

            
            function loadIndonesiaBoundary() {
                if (!isMapReady || !map) return;
                
                
                const geoUrl = 'https://raw.githubusercontent.com/amadeuszen/indonesia-geojson/main/idn_province.geojson';

                fetch(geoUrl)
                    .then(res => {
                        if (!res.ok) throw new Error('Gagal fetch GeoJSON');
                        return res.json();
                    })
                    .then(data => {
                        L.geoJSON(data, {
                            style: {
                                color: '#4fc3f7',
                                weight: 1,
                                opacity: 0.25,
                                fill: false,
                                dashArray: '4, 6'
                            },
                            onEachFeature: function(feature, layer) {
                                if (feature.properties && feature.properties.NAME_1) {
                                    layer.bindTooltip(feature.properties.NAME_1, {
                                        permanent: false,
                                        direction: 'center',
                                        opacity: 0.6
                                    });
                                }
                            }
                        }).addTo(map);
                    })
                    .catch(err => console.warn('⚠️ Gagal load batas provinsi:', err));
            }

            
            function updateTime() {
                const now = new Date();
                const el = document.getElementById('live-time');
                if (el) {
                    el.textContent = now.toLocaleTimeString('id-ID', { 
                        hour: '2-digit', 
                        minute: '2-digit',
                        second: '2-digit'
                    }) + ' WIB';
                }
            }

            
            window.refreshRadar = function() {
                document.getElementById('warning-message').textContent = 'Memuat ulang data dari satelit...';
                loadRadar();
            };

            window.toggleLegend = function() {
                const legend = document.getElementById('legend');
                if (legend) {
                    legend.style.display = legend.style.display === 'none' ? 'flex' : 'none';
                }
            };

            window.centerMap = function() {
                if (map) {
                    map.flyTo(CONFIG.center, CONFIG.zoom, {
                        animate: true,
                        duration: 1.5
                    });
                }
            };

            
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initMap);
            } else {
                initMap();
            }

            window.addEventListener('resize', function() {
                if (map) {
                    setTimeout(() => map.invalidateSize(), 200);
                }
            });

        })();
    </script>
</body>
</html>
